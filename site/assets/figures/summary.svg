<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 560' width='900' height='560' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='900' height='560' fill='#fff' rx='10'/>
<text x='30' y='42' font-size='22' font-weight='700' fill='#1c1c1a'>Did the agent stick to its decisions?</text>
<text x='30' y='84' font-size='17' font-weight='700' fill='#1c1c1a'>Coding agent (Claude Code), 97 runs, 10 tasks with a two-way design choice</text>
<text x='30' y='124' font-size='15' fill='#1c1c1a'>tempted to switch for no good reason (54 runs)</text>
<rect x='380' y='104' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='104' width='460.0' height='30' fill='#2f855a' rx='4'/>
<text x='390.0' y='125' font-size='15' font-weight='700' fill='#fff'>54 of 54 kept their choice</text>
<text x='30' y='168' font-size='15' fill='#1c1c1a'>given a real reason to switch (43 runs)</text>
<rect x='380' y='148' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='148' width='460.0' height='30' fill='#2b6cb0' rx='4'/>
<text x='390.0' y='169' font-size='15' font-weight='700' fill='#fff'>43 of 43 switched</text>
<text x='30' y='212' font-size='15' fill='#1c1c1a'>ended up with both designs mixed together</text>
<rect x='380' y='192' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='192' width='0.0' height='30' fill='#c05621' rx='4'/>
<text x='388.0' y='213' font-size='15' font-weight='700' fill='#1c1c1a'>0 of 97</text>
<text x='30' y='250' font-size='13' fill='#6b6b66'>Includes runs where the agent's memory was wiped between rounds (it re-read its own code) and runs where a finished version of the other design was handed to it.</text>
<text x='30' y='306' font-size='17' font-weight='700' fill='#1c1c1a'>Hangman, the case Williams cites (Sonnet 5), 192 games</text>
<text x='30' y='346' font-size='15' fill='#1c1c1a'>changed its secret word after revealing it (96 games checked)</text>
<rect x='380' y='326' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='326' width='0.0' height='30' fill='#c05621' rx='4'/>
<text x='388.0' y='347' font-size='15' font-weight='700' fill='#1c1c1a'>0 of 96</text>
<text x='30' y='392' font-size='15' fill='#1c1c1a'>games with at least one miscounted letter:</text>
<text x='30' y='424' font-size='15' fill='#1c1c1a'>   no notepad (tools off)</text>
<rect x='380' y='404' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='404' width='38.3' height='30' fill='#c05621' rx='4'/>
<text x='426.3' y='425' font-size='15' font-weight='700' fill='#1c1c1a'>2 of 24</text>
<text x='30' y='464' font-size='15' fill='#1c1c1a'>   notepad available, nothing said</text>
<rect x='380' y='444' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='444' width='19.2' height='30' fill='#c05621' rx='4'/>
<text x='407.2' y='465' font-size='15' font-weight='700' fill='#1c1c1a'>1 of 24</text>
<text x='30' y='504' font-size='15' fill='#1c1c1a'>   forced to read the notepad every turn</text>
<rect x='380' y='484' width='460' height='30' fill='#d9d8d2' rx='4'/>
<rect x='380' y='484' width='191.7' height='30' fill='#c05621' rx='4'/>
<text x='390.0' y='505' font-size='15' font-weight='700' fill='#fff'>10 of 24</text>
<text x='30' y='540' font-size='13' fill='#6b6b66'>The word never changed; the letters got miscounted, and a notepad did not help with that.</text>
</svg>