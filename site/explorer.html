<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run explorer · agent-commitment</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script src="assets/common.js"></script></head>
<body><header class="top"><div class="wrap"></div></header>
<main class="wrap">
<h1 style="font-size:24px">Run explorer</h1>
<div class="explorer">
  <aside class="side card">
    <label for="task">Task</label><select id="task"></select>
    <label for="run">Run (arm · repetition)</label><select id="run"></select>
    <label>Show event types</label><div class="filters" id="types"></div>
    <label>Jump to</label><div class="jump" id="jump"></div>
    <label>Expand</label><div class="jump"><button id="expandAll">expand all</button><button id="collapseAll">collapse all</button><button id="expandCommit">commitment-related only</button></div>
    <p class="small muted">Keyboard: use Tab to move between events; Enter toggles.</p>
  </aside>
  <section id="main"><p class="muted">Loading…</p></section>
</div>
<footer>agent-commitment · <a id="ghlink" href="#">GitHub</a></footer>
</main>
<script src="assets/explorer.js"></script>
</body></html>
