<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analysis · agent-commitment</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script><script src="assets/common.js"></script></head>
<body><noscript><div class="wrap"><p class="callout">This page needs JavaScript. Without it, read RESULTS.md and the raw runs on GitHub.</p></div></noscript><header class="top"><div class="wrap"></div></header>
<main class="wrap"><h1>Analysis</h1><div id="doc" class="md"></div><h2>Results tables</h2><div id="results_md" class="md"></div><h2>Skeptical review</h2><div id="review_md" class="md"></div>
<footer>agent-commitment · <a id="ghlink" href="#">GitHub</a></footer></main>
<script>
(async () => {
  const idx = await ACX.loadIndex(); ACX.nav('analysis.html'); document.getElementById('ghlink').href = idx.github;
  const map = {methodology: 'METHODOLOGY_md', analysis: 'docs_analysis_md', limitations: 'docs_limitations_md'};
  const fix = s => (s || '').replace(/^# [^\n]*\n/, '').replace(/\]\((?!http)([^)]+\.md)(#[^)]*)?\)/g, (m, p, h) => '](' + idx.github + '/blob/main/' + p + (h||'') + ')');
  document.getElementById('doc').innerHTML = ACX.md(fix(idx[map['analysis']] || '_pending_'));
  for (const [id, key] of [['rubric_md','rubric_md'],['changelog_md','changelog_md'],['williams_md','williams_md'],['results_md','RESULTS_md'],['review_md','docs_review_skeptical-review_md'],['validation_md','docs_review_pre-run-validation_md']]) { const el = document.getElementById(id); if (el) el.innerHTML = ACX.md(fix(idx[key] || '_pending_')); }
})();
</script></body></html>
